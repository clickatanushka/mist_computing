# =============================================================
#  omnetpp.ini  —  Multi-Attack Adaptive IDS
# =============================================================
[General]
network = IDSNetwork
sim-time-limit = 60s
record-eventlog = false

# ── Output ────────────────────────────────────────────────────
output-scalar-file = results/ids_results.sca
output-vector-file = results/ids_results.vec

# ── Logging ──────────────────────────────────────────────────
**.scalar-recording = true
**.vector-recording = true

# =============================================================
#  Run 1: DDoS only    (iot[0] attacks at t=5, others normal)
#  Run 2: SQLi only    (iot[1] attacks at t=15)
#  Run 3: MitM only    (iot[2] attacks at t=25)
#  Run 4: All 3 mixed  (all attackers active)
# =============================================================

[Config DDoS-Only]
description = "DDoS flood test — controller should lock to MODE_DDOS"
sim-time-limit = 30s

[Config SQLi-Only]
description = "SQL-Injection payload test — controller should lock to MODE_SQLI"
sim-time-limit = 40s

[Config MitM-Only]
description = "Man-in-the-Middle delay test — controller should lock to MODE_MITM"
sim-time-limit = 50s

[Config Mixed-Attack]
description = "All 3 attack types, dynamic mode switching"
sim-time-limit = 60s